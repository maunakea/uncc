<HTML><HEAD><TITLE>ProductReport.com : New user registration</TITLE></HEAD>
<STYLE type=text/css>
A:link {
	TEXT-DECORATION: none
}
A:active {
	TEXT-DECORATION: none
}
A:visited {
	TEXT-DECORATION: none
}
FONT {
	FONT-FAMILY: Veranda, Arial, Helvetica, sans-serif; FONT-STYLE: normal
}
</STYLE>
<BODY background=images/newuser_bg.gif bgColor=#ffffff text=#000000>
<DIV id=newUserHeading style="LEFT: 330px; POSITION: absolute; TOP: 117px; VISIBILITY: visible">
<IMG src=images/newuser_reg.gif>
</DIV>
<DIV id=newUserForm style="LEFT: 250px; POSITION: absolute; TOP: 150px; VISIBILITY: visible">
<FORM method=post name=registration_form>
<TABLE border=0 cellPadding=2 cellSpacing=0>
  <TBODY>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>User ID:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2><INPUT maxLength=6 size=6 name=Uid
></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Name:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2><INPUT maxLength=25 name=Uname
></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Password:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2><INPUT maxLength=6 size=6 type=paft vAlign=center><FONT size=2><INPUT maxLength=6 size=6 type=password name=Password
></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Re-type Password:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2><INPUT maxLength=6 size=6 type=password name=RePassword
></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Address:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2><INPUT maxLength=80 size=30 name=Address
></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Sex:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2>
       <INPUT TYPE="radio" name=Sex
 value="Male" checked>Male
       <INPUT TYPE="radio" name=Sex value="Female">Female
    </FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Income Group:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2>
       <SELECT name=IncomeGroup
 SIZE="1">
         <OPTION SELECTED>
         <OPTION>below 35 K
         <OPTION>35-50 K
         <OPTION>51-65 K
         <OPTION>66-85 K
         <OPTION>86-100 K
         <OPTION>over 100 K
       </SELECT></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>No. of household:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2>
       <SELECT name=NoOfHousehold
 SIZE="1">
         <OPTION SELECTED>
         <OPTION>1Household
  SIZE="1">
          <OPTION SELECTED>
          <OPTION>1
         <OPTION>2
         <OPTION>3
         <OPTION>4
         <OPTION>5
         <OPTION>6
         <OPTION>7
         <OPTION>8
         <OPTION>9
         <OPTION>10
         <OPTION>100
       </SELECT></FONT></TD></TR>
  <TR>
    <TD align=right vAlign=center><FONT color=steelblue size=2>Date of birth:</FONT></TD>
    <TD align=left vAlign=center><FONT size=2><INPUT maxLength=8 size=8 name=DOB
></FONT><FONT color=steelblue size=2> (mm/dd/yy)</FONT></TD></TR>
  <TR>
    <TD align=middle colSpan=2><FONT size=2><INPUT name=register type=submit value=Register> 
    <INPUT name=clear type=reset value=Clear> 
    </FONT></TD></TR>

<!-- ###### -->

</TBODY></TABLE></FORM></DIV>
</BODY>
</HTML>
</TBODY></TABLE></FORM></DIV>
 </BODY>
 </HTML>
