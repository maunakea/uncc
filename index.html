<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Satish Narayan</title>
	<script src="displayToc.js"></script>
	<style>
		* { margin: 0; padding: 0; }
		html, body { height: 100%; overflow: hidden; }
		#layout {
			display: flex;
			height: 100%;
		}
		#sidebar {
			width: 120px;
			min-width: 120px;
			background-color: #D6CEBD;
			display: flex;
			flex-direction: column;
		}
		#tocHead {
			height: 70px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#toc {
			flex: 1;
			background-color: #D6CEBD;
			text-align: center;
			overflow-y: auto;
		}
		#tocTail {
			height: 160px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}
		#content {
			flex: 1;
			border: none;
			height: 100%;
		}
	</style>
</head>
<body onload="reDisplay()">
	<div id="layout">
		<div id="sidebar">
			<div id="tocHead">
				<a href="home.html" onclick="loadContent('home.html'); reDisplay(); return false;">
					<img src="images/home.gif" alt="Home" border="0">
				</a>
			</div>
			<div id="toc"></div>
			<div id="tocTail">
				<a href="mailto:satishnryn@netscape.net"><img src="images/email.gif" alt="Email" border="0"></a>
				<a href="http://www.uncc.edu" target="_blank" rel="noopener"><img src="images/uncc.gif" alt="UNCC" border="0"></a>
			</div>
		</div>
		<iframe id="content" name="content" src="home.html" title="Page content"></iframe>
	</div>
</body>
</html>
